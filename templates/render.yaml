services:
  - type: web
    name: shop
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: python -m gunicorn myshop.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: shop-4-6n0w.onrender.com
